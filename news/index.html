<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI News Brief Podcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a single listening column. Player console on top with a chapter-segmented scrubber, then the rundown of chapters grouped by section. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --ink: #15212b;
  --muted: #5b6b78;
  --line: #d5dde3;
  --accent: #0b7a75;
  --accent-ink: #ffffff;
  --live: #e0f1ef;
  --s-models: #0b7a75;
  --s-research: #5a5fc8;
  --s-business: #b5651d;
  --s-popular: #c23b5a;
  --s-impl: #4f7d2c;
  --s-other: #8a98a4;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171d; --surface: #17222a; --ink: #e4ebf0; --muted: #93a3af; --line: #2a3943;
    --accent: #3cc2b9; --accent-ink: #062a28; --live: #18332f;
    --s-models: #3cc2b9; --s-research: #8f93f0; --s-business: #e39a55; --s-popular: #ef7c96; --s-impl: #8fc46a; --s-other: #6c7b86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171d; --surface: #17222a; --ink: #e4ebf0; --muted: #93a3af; --line: #2a3943;
  --accent: #3cc2b9; --accent-ink: #062a28; --live: #18332f;
  --s-models: #3cc2b9; --s-research: #8f93f0; --s-business: #e39a55; --s-popular: #ef7c96; --s-impl: #8fc46a; --s-other: #6c7b86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 22px; }
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
.episodes { display: flex; flex-wrap: wrap; gap: 8px; }
.episodes button { font-family: var(--f-mono); font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.episodes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.console { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; box-shadow: 0 6px 24px -18px rgba(0,0,0,.4); }
.now { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.play { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; }
.play svg { width: 22px; height: 22px; fill: currentColor; }
.nowtext { min-width: 0; display: grid; gap: 2px; }
.nowsec { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.nowtitle { font-family: var(--f-display); font-weight: 500; font-size: 18px; line-height: 1.25; overflow-wrap: anywhere; }
.scrub { position: relative; height: 26px; cursor: pointer; touch-action: none; }
.segs { position: absolute; inset: 9px 0; display: flex; gap: 2px; }
.segs span { height: 8px; border-radius: 2px; opacity: .28; }
.progress { position: absolute; inset: 9px 0; height: 8px; display: flex; gap: 2px; pointer-events: none; clip-path: inset(0 100% 0 0); }
.progress span { height: 8px; border-radius: 2px; }
.knob { position: absolute; top: 5px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transform: translateX(-50%); pointer-events: none; border: 3px solid var(--surface); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.ctl { white-space: nowrap; font-family: var(--f-mono); font-size: 12px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.time { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.rundown { display: grid; gap: 26px; }
.section h2 { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .02em; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.section h2 i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chap { border-top: 1px solid var(--line); padding-block: 12px; display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; }
.chap:last-child { border-bottom: 1px solid var(--line); }
.chap.live { background: var(--live); border-radius: 8px; border-color: transparent; padding-inline: 8px; margin-inline: -8px; }
.ts { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--accent); background: none; border: 0; padding: 2px 0; cursor: pointer; text-align: left; align-self: start; }
.cbody { min-width: 0; display: grid; gap: 6px; }
.ctitle { font-family: var(--f-display); font-weight: 500; font-size: 17px; line-height: 1.3; background: none; border: 0; padding: 0; color: var(--ink); text-align: left; cursor: pointer; }
.meta { display: flex; flex-wrap: wrap; gap: 14px; font-family: var(--f-mono); font-size: 12px; }
.meta a, .meta button { color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
.transcript { display: grid; gap: 8px; font-size: 15px; max-width: 65ch; }
.transcript p { margin: 0; }
.transcript b { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.status { color: var(--muted); font-family: var(--f-mono); font-size: 13px; }
footer { color: var(--muted); font-size: 13px; font-family: var(--f-mono); }
@media (max-width: 480px) { .chap { grid-template-columns: 54px 1fr; } .console { padding: 14px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Daily audio edition &middot; AI News Brief</div>
    <h1 id="ep-title">AI News Brief</h1>
    <div class="episodes" id="episodes" aria-label="Episodes"></div>
  </header>

  <section class="console" aria-label="Player">
    <div class="now">
      <button class="play" id="play" aria-label="Play">
        <svg viewBox="0 0 24 24" id="play-icon"><path d="M7 4.5v15l13-7.5z"/></svg>
      </button>
      <div class="nowtext">
        <div class="nowsec" id="now-sec">Loading episode</div>
        <div class="nowtitle" id="now-title">&nbsp;</div>
      </div>
    </div>
    <div class="scrub" id="scrub" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="segs" id="segs"></div>
      <div class="progress" id="progress"></div>
      <div class="knob" id="knob" style="left:0"></div>
    </div>
    <div class="controls">
      <div class="btns">
        <button class="ctl" id="prev" aria-label="Previous chapter">&#9198; Prev</button>
        <button class="ctl" id="back">&minus;15s</button>
        <button class="ctl" id="fwd">+30s</button>
        <button class="ctl" id="next" aria-label="Next chapter">Next &#9197;</button>
        <button class="ctl" id="rate">1&times;</button>
      </div>
      <div class="time" id="time">0:00 / 0:00</div>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </section>

  <main class="rundown" id="rundown"><p class="status">Loading the rundown&hellip;</p></main>
  <footer id="foot"></footer>
</div>

<script>
(() => {
  const SECTION_COLOR = {
    "Model updates": "var(--s-models)", "Research & studies": "var(--s-research)",
    "New business applications": "var(--s-business)", "Popular models right now": "var(--s-popular)",
    "Implementing AI": "var(--s-impl)"
  };
  const color = s => SECTION_COLOR[s] || "var(--s-other)";
  const $ = id => document.getElementById(id);
  const audio = $("audio");
  const RATES = [1, 1.25, 1.5, 1.75, 0.9];
  let data = null, ep = null, cur = -1;

  const fmt = t => { t = Math.max(0, Math.floor(t || 0)); const m = Math.floor(t / 60), s = t % 60; return m + ":" + String(s).padStart(2, "0"); };
  const dur = () => (isFinite(audio.duration) && audio.duration) || ep?.duration || 0;
  const chapterAt = t => { let i = 0; ep.chapters.forEach((c, k) => { if (t + 0.05 >= c.start) i = k; }); return i; };
  const endOf = i => i + 1 < ep.chapters.length ? ep.chapters[i + 1].start : dur();

  function seekTo(t, play) {
    audio.currentTime = Math.max(0, Math.min(t, dur() - 0.1));
    if (play) audio.play().catch(() => {});
    tick();
  }

  function buildBar() {
    const D = ep.duration, segs = $("segs"), prog = $("progress");
    segs.innerHTML = ""; prog.innerHTML = "";
    ep.chapters.forEach((c, i) => {
      const w = (endOf(i) - c.start) / D * 100;
      const a = document.createElement("span"); a.style.flex = w + " 0 0"; a.style.background = color(c.section); a.title = c.title; segs.append(a);
      const b = document.createElement("span"); b.style.flex = w + " 0 0"; b.style.background = color(c.section); prog.append(b);
    });
  }

  function render() {
    $("ep-title").textContent = new Date(ep.date + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    const r = $("rundown"); r.innerHTML = "";
    let section = null, list = null;
    ep.chapters.forEach((c, i) => {
      if (c.section !== section) {
        section = c.section;
        const sec = document.createElement("section"); sec.className = "section";
        const h = document.createElement("h2"); const dot = document.createElement("i"); dot.style.background = color(section);
        h.append(dot, document.createTextNode(section)); sec.append(h);
        list = document.createElement("div"); sec.append(list); r.append(sec);
      }
      const row = document.createElement("article"); row.className = "chap"; row.id = "c-" + c.id; row.dataset.i = i;
      const ts = document.createElement("button"); ts.className = "ts"; ts.textContent = fmt(c.start); ts.setAttribute("aria-label", "Play from " + fmt(c.start));
      ts.onclick = () => seekTo(c.start, true);
      const body = document.createElement("div"); body.className = "cbody";
      const t = document.createElement("button"); t.className = "ctitle"; t.textContent = c.title; t.onclick = () => seekTo(c.start, true);
      const meta = document.createElement("div"); meta.className = "meta";
      const mins = document.createElement("span"); mins.style.color = "var(--muted)"; mins.textContent = fmt(endOf(i) - c.start);
      meta.append(mins);
      if (c.source) { const a = document.createElement("a"); a.href = c.source; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Source \u2197"; meta.append(a); }
      const lines = (ep.transcript || {})[c.id];
      let tr = null;
      if (lines) {
        const tb = document.createElement("button"); tb.textContent = "Transcript"; tb.setAttribute("aria-expanded", "false");
        tr = document.createElement("div"); tr.className = "transcript"; tr.hidden = true;
        lines.forEach(([who, txt]) => { const p = document.createElement("p"); const b = document.createElement("b"); b.textContent = who; p.append(b, document.createTextNode(txt)); tr.append(p); });
        tb.onclick = () => { tr.hidden = !tr.hidden; tb.setAttribute("aria-expanded", String(!tr.hidden)); };
        meta.append(tb);
      }
      body.append(t, meta); if (tr) body.append(tr);
      row.append(ts, body); list.append(row);
    });
    $("foot").textContent = `${ep.chapters.length} chapters \u00b7 ${fmt(ep.duration)} \u00b7 voices are synthetic (Kokoro TTS)`;
    buildBar(); cur = -1; tick();
  }

  function loadEpisode(i, autoplayAt) {
    ep = data.episodes[i];
    audio.src = ep.audio;
    try { localStorage.setItem("aib-ep", ep.date); } catch (e) {}
    document.querySelectorAll("#episodes button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
    render();
    if (autoplayAt != null) audio.addEventListener("loadedmetadata", () => seekTo(autoplayAt, false), { once: true });
  }

  function tick() {
    if (!ep) return;
    const t = audio.currentTime || 0, D = dur();
    const pct = D ? t / D * 100 : 0;
    $("progress").style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
    $("knob").style.left = pct + "%";
    $("time").textContent = fmt(t) + " / " + fmt(D);
    const sc = $("scrub"); sc.setAttribute("aria-valuemax", Math.round(D)); sc.setAttribute("aria-valuenow", Math.round(t)); sc.setAttribute("aria-valuetext", fmt(t));
    const i = chapterAt(t);
    if (i !== cur) {
      cur = i; const c = ep.chapters[i];
      $("now-sec").textContent = c.section; $("now-sec").style.color = color(c.section);
      $("now-title").textContent = c.title;
      document.querySelectorAll(".chap").forEach(el => el.classList.toggle("live", +el.dataset.i === i));
    }
  }

  function setIcon() { $("play-icon").innerHTML = audio.paused ? '<path d="M7 4.5v15l13-7.5z"/>' : '<path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/>'; $("play").setAttribute("aria-label", audio.paused ? "Play" : "Pause"); }
  $("play").onclick = () => audio.paused ? audio.play().catch(() => {}) : audio.pause();
  audio.addEventListener("play", setIcon); audio.addEventListener("pause", setIcon);
  audio.addEventListener("timeupdate", tick); audio.addEventListener("loadedmetadata", tick);
  $("back").onclick = () => seekTo(audio.currentTime - 15);
  $("fwd").onclick = () => seekTo(audio.currentTime + 30);
  $("prev").onclick = () => { const i = chapterAt(audio.currentTime); const c = ep.chapters[i]; seekTo(audio.currentTime - c.start > 3 || i === 0 ? c.start : ep.chapters[i - 1].start, !audio.paused); };
  $("next").onclick = () => { const i = chapterAt(audio.currentTime); if (i + 1 < ep.chapters.length) seekTo(ep.chapters[i + 1].start, !audio.paused); };
  let ri = 0; $("rate").onclick = () => { ri = (ri + 1) % RATES.length; audio.playbackRate = RATES[ri]; $("rate").textContent = RATES[ri] + "\u00d7"; };

  const scrub = $("scrub");
  const posToTime = e => { const r = scrub.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * dur(); };
  let dragging = false;
  scrub.addEventListener("pointerdown", e => { dragging = true; scrub.setPointerCapture(e.pointerId); seekTo(posToTime(e)); });
  scrub.addEventListener("pointermove", e => { if (dragging) seekTo(posToTime(e)); });
  scrub.addEventListener("pointerup", () => dragging = false);
  scrub.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { seekTo(audio.currentTime + 5); e.preventDefault(); }
    if (e.key === "ArrowLeft") { seekTo(audio.currentTime - 5); e.preventDefault(); }
  });
  document.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); $("play").click(); } });

  fetch("episodes.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    data = d;
    const bar = $("episodes");
    d.episodes.forEach((e, i) => {
      const b = document.createElement("button"); b.textContent = new Date(e.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      b.onclick = () => { audio.pause(); loadEpisode(i); }; bar.append(b);
    });
    let idx = 0;
    const hash = location.hash.slice(1);
    const byDate = d.episodes.findIndex(e => e.date === hash);
    if (byDate >= 0) idx = byDate;
    loadEpisode(idx);
    const ch = ep.chapters.find(c => c.id === hash);
    if (ch) { audio.addEventListener("loadedmetadata", () => seekTo(ch.start), { once: true }); document.getElementById("c-" + ch.id)?.scrollIntoView(); }
  }).catch(() => {
    $("rundown").innerHTML = '<p class="status">The episode list could not be loaded. Reload the page to try again.</p>';
    $("now-sec").textContent = "Unavailable";
  });
})();
</script>

</body></html>
